<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">白山 — Algorithm Engineer and LLM Application Engineer</title>
  <desc id="desc">A system trace flows from signal through model and tools to evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="1" stop-color="#1A2630"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#B7D2D8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <linearGradient id="trace" x1="0" x2="1">
      <stop offset="0" stop-color="#72E1D2"/>
      <stop offset="1" stop-color="#F4AF69"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <path d="M0 281H1200" stroke="#A8C6CE" stroke-opacity=".15"/>
  <text x="64" y="78" fill="#72E1D2" font-family="monospace" font-size="14" letter-spacing="3">ENGINEERING / INTELLIGENCE SYSTEMS</text>
  <text x="60" y="177" fill="#F3F1EA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="650" letter-spacing="2">白山</text>
  <text x="64" y="218" fill="#C7D1D3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" letter-spacing=".4">Algorithm Engineer  ·  LLM Application Engineer</text>
  <text x="64" y="260" fill="#87999F" font-family="monospace" font-size="13" letter-spacing="1.8">MODEL → TOOLS → EVALUATION</text>

  <g transform="translate(706 77)">
    <path d="M22 78H126C147 78 148 43 174 43H275C299 43 297 113 324 113H436" fill="none" stroke="#40545B" stroke-width="2"/>
    <path d="M22 78H126C147 78 148 43 174 43H275C299 43 297 113 324 113H436" fill="none" stroke="url(#trace)" stroke-width="2.5" stroke-dasharray="4 8"/>
    <circle cx="22" cy="78" r="8" fill="#111820" stroke="#72E1D2" stroke-width="3"/>
    <circle cx="174" cy="43" r="8" fill="#111820" stroke="#72E1D2" stroke-width="3"/>
    <circle cx="324" cy="113" r="8" fill="#111820" stroke="#F4AF69" stroke-width="3"/>
    <circle cx="436" cy="113" r="8" fill="#111820" stroke="#F4AF69" stroke-width="3"/>
    <text x="22" y="119" text-anchor="middle" fill="#95AAA9" font-family="monospace" font-size="11" letter-spacing="1">INPUT</text>
    <text x="174" y="18" text-anchor="middle" fill="#95AAA9" font-family="monospace" font-size="11" letter-spacing="1">MODEL</text>
    <text x="324" y="151" text-anchor="middle" fill="#95AAA9" font-family="monospace" font-size="11" letter-spacing="1">TOOLS</text>
    <text x="436" y="151" text-anchor="middle" fill="#95AAA9" font-family="monospace" font-size="11" letter-spacing="1">EVAL</text>
    <path d="M174 43V139M324 113V182M436 113V182" stroke="#AFC6C8" stroke-opacity=".17" stroke-dasharray="2 6"/>
    <circle cx="275" cy="43" r="3" fill="#72E1D2"/>
    <circle cx="275" cy="113" r="3" fill="#F4AF69"/>
  </g>
  <text x="1136" y="300" text-anchor="end" fill="#708187" font-family="monospace" font-size="11" letter-spacing="2">BAISHAN / GH</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">白山 — Neural Field, Refined</title>
  <desc id="desc">A refined AI engineering profile banner with a measured neural system map and an evaluation feedback loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1019"/>
      <stop offset=".58" stop-color="#101927"/>
      <stop offset="1" stop-color="#151C2B"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#82D5DC"/>
      <stop offset=".58" stop-color="#A6B5DF"/>
      <stop offset="1" stop-color="#D5B99A"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#97AEE7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#97AEE7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#B4C5D6" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8Z" fill="#D5B99A"/>
    </marker>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <path d="M64 292H1136" stroke="#A7B5C5" stroke-opacity=".18"/>
  <path d="M656 42V280" stroke="#A7B5C5" stroke-opacity=".12"/>

  <text x="68" y="61" fill="#82D5DC" font-family="monospace" font-size="11" letter-spacing="2.8">AI SYSTEMS  /  ALGORITHMIC ENGINEERING</text>
  <text x="64" y="153" fill="#F0F2F2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="69" font-weight="640" letter-spacing="1">白山</text>
  <text x="222" y="149" fill="#A3AFBB" font-family="monospace" font-size="15" letter-spacing="2.4">BAISHAN</text>
  <text x="68" y="198" fill="#E4E9E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">AI 算法工程师  ·  AI 大模型应用开发工程师</text>
  <text x="68" y="229" fill="#AAB6BE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">AI Algorithm Engineer  ·  LLM Application Engineer</text>
  <text x="68" y="270" fill="#9ED9DC" font-family="monospace" font-size="10" letter-spacing="1.7">FROM PROBLEM FRAMING TO MEASURABLE SYSTEMS</text>
  <text x="68" y="318" fill="#6F7D8B" font-family="monospace" font-size="9" letter-spacing="2">PROFILE  /  01</text>

  <g transform="translate(705 52)">
    <text x="0" y="9" fill="#718093" font-family="monospace" font-size="9" letter-spacing="2">SYSTEM MAP  /  EVALUATION FEEDBACK</text>
    <path d="M28 117H108C130 117 135 80 162 80H247C271 80 280 117 307 117H405" fill="none" stroke="#506073" stroke-opacity=".48" stroke-width="1.2"/>
    <path d="M28 117H108C130 117 135 80 162 80H247C271 80 280 117 307 117H405" fill="none" stroke="url(#route)" stroke-width="2" stroke-dasharray="2 7"/>
    <path d="M405 128C393 191 337 206 290 187C267 178 253 154 247 92" fill="none" stroke="#D5B99A" stroke-opacity=".66" stroke-width="1.2" stroke-dasharray="3 6" marker-end="url(#arrow)"/>
    <path d="M162 80V200M247 80V214M307 117V214" stroke="#92A1B1" stroke-opacity=".16" stroke-dasharray="2 7"/>
    <ellipse cx="247" cy="119" rx="103" ry="96" fill="url(#core)"/>
    <ellipse cx="247" cy="119" rx="82" ry="64" fill="none" stroke="#91A6C3" stroke-opacity=".22"/>
    <ellipse cx="247" cy="119" rx="56" ry="85" fill="none" stroke="#91A6C3" stroke-opacity=".13" transform="rotate(26 247 119)"/>

    <g fill="url(#core)" filter="url(#soft-glow)">
      <circle cx="162" cy="80" r="16"/><circle cx="247" cy="80" r="21"/><circle cx="405" cy="117" r="17"/>
    </g>
    <g fill="#101927" stroke="url(#route)" stroke-width="1.7">
      <circle cx="28" cy="117" r="5"/><circle cx="108" cy="117" r="3.5"/>
      <circle cx="162" cy="80" r="5"/><circle cx="247" cy="80" r="7"/>
      <circle cx="307" cy="117" r="4"/><circle cx="405" cy="117" r="5.5"/>
    </g>
    <g fill="#9CAAB8" font-family="monospace" font-size="8" letter-spacing="1">
      <text x="28" y="142" text-anchor="middle">TASK</text>
      <text x="162" y="62" text-anchor="middle">DATA</text>
      <text x="247" y="58" text-anchor="middle" fill="#DDE3EE">MODEL</text>
      <text x="307" y="142" text-anchor="middle">TOOLS</text>
      <text x="405" y="142" text-anchor="middle">EVAL</text>
      <text x="344" y="207" text-anchor="middle" fill="#C8B69C">ITERATE</text>
    </g>
    <path d="M0 238H438" stroke="#A7B5C5" stroke-opacity=".16"/>
    <text x="0" y="257" fill="#8190A1" font-family="monospace" font-size="8" letter-spacing="1.3">QUALITY</text>
    <path d="M55 254H105" stroke="#82D5DC" stroke-width="2"/>
    <text x="136" y="257" fill="#8190A1" font-family="monospace" font-size="8" letter-spacing="1.3">LATENCY</text>
    <path d="M201 254H251" stroke="#A6B5DF" stroke-width="2"/>
    <text x="282" y="257" fill="#8190A1" font-family="monospace" font-size="8" letter-spacing="1.3">COST</text>
    <path d="M320 254H370" stroke="#D5B99A" stroke-width="2"/>
  </g>
  <text x="1134" y="318" text-anchor="end" fill="#6F7D8B" font-family="monospace" font-size="9" letter-spacing="2">BAISHAN / GITHUB</text>
</svg>
